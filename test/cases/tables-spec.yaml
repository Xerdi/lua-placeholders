basic table:
  type: table
  columns:
    desc:
      type: string
      placeholder: The description
    price:
      type: number
      placeholder: The price
underscore table:
  type: table
  columns:
    item:
      type: number
      placeholder: The item number
    item_name:
      type: string
      placeholder: The item
    unit_price:
      type: number
      placeholder: The unit price
weird value table:
  type: table
  columns:
    label:
      type: string
      placeholder: Label
    note:
      type: string
      placeholder: Note
order table:
  type: table
  columns:
    customer:
      type: string
      placeholder: The customer
    items:
      type: list
      item type: string
    shipping:
      type: object
      fields:
        street:
          type: string
          placeholder: Street
        city:
          type: string
          placeholder: City
